{% extends "base.html" %}
{% block title %}{{ _('Forgot Password') }} - WaaS Portal{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-envelope display-3 text-primary"></i>
                    <h3 class="mt-2">{{ _('Reset Password') }}</h3>
                    <p class="text-muted">{{ _('Enter your email address and we\'ll send you a reset link.') }}</p>
                </div>
                <form method="POST" class="needs-validation" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="email" class="form-label">{{ _('Email') }}</label>
                        <input type="email" class="form-control" name="email" id="email"
                               placeholder="user@example.com" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-send"></i> {{ _('Send Reset Link') }}
                    </button>
                </form>
                <div class="text-center mt-3">
                    <a href="{{ url_for('auth.login') }}" class="small text-muted">{{ _('Back to login') }}</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
