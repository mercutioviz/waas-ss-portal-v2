{% extends "base.html" %}
{% block title %}{{ _('Set New Password') }} - WaaS Portal{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-lock display-3 text-primary"></i>
                    <h3 class="mt-2">{{ _('Set New Password') }}</h3>
                </div>
                <form method="POST" class="needs-validation" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="password" class="form-label">{{ _('New Password') }}</label>
                        <input type="password" class="form-control" name="password" id="password"
                               placeholder="{{ _('Enter new password') }}" required minlength="8">
                    </div>
                    <div class="mb-3">
                        <label for="password_confirm" class="form-label">{{ _('Confirm New Password') }}</label>
                        <input type="password" class="form-control" name="password_confirm" id="password_confirm"
                               placeholder="{{ _('Confirm new password') }}" required minlength="8">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-check-lg"></i> {{ _('Reset Password') }}
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
